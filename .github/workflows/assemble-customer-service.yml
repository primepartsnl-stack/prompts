name: Assemble customer-service.md

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-customer-service.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble file
        shell: bash
        run: |
          cat .cs-build/part-*.txt > customer-service.md
          rm -rf .cs-build

      - name: Commit assembled file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add complete customer-service.md"
          git push
